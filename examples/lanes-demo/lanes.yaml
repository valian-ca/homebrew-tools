schema: 2
ports:
  block: 24
  names: [web, extra,
          auth, firestore, firestore_ws, functions, pubsub, eventarc, tasks, hub, ui, logging,
          test_auth, test_firestore, test_firestore_ws, test_functions, test_pubsub, test_eventarc, test_tasks, test_hub, test_logging]
resources:
  - scripts:
      name: demo-store
      create: tool/lane-store create
      erase: tool/lane-store erase
      list: tool/lane-store list
      owner: tool/lane-store owner
  - firebase:
      config: firebase.emulator.json
      seed: seed
  - mysql:
      port: 3316
      start: tool/mysql-server 3316
      databases:
        dev: lanes_demo_{lane}
        test: lanes_demo_test_{lane}
env:
  DEMO_WEB_URL: http://{{.LANES_HOST}}:{{.PORT_WEB}}
  DEMO_DATABASE_URL: mysql://{{.LANES_MYSQL_USER}}@{{.LANES_MYSQL_HOST}}:{{.LANES_MYSQL_PORT}}/{{.LANES_MYSQL_DATABASE_DEV}}
generate:
  - template: app.env.tmpl
  - template: db.env.tmpl
setup:
  - name: deps
    run: tool/install.sh
    when_changed: [deps.lock]
  - name: node
    run: npm ci --prefer-offline --no-audit --no-fund
    when_changed: [package-lock.json]
shared: [lanes-demo-shared]
