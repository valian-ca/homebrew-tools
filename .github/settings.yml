repository:
  name: homebrew-tools
  description: Homebrew tap of Valian's internal developer tools
  topics: homebrew, homebrew-tap, developer-tools

  # A public tap: brew install valian-ca/tools/<name> needs no credentials.
  private: false
  is_template: false
  default_branch: main

  has_issues: true
  has_wiki: false
  has_downloads: false
  has_projects: false

  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

labels:
  - name: bug
    color: '#cc0000'
    description: Something is broken
  - name: feature
    color: '#336699'
    description: New functionality
  - name: chore
    color: '#f2df8c'
    description: Repository or code maintenance
  - name: documentation
    color: '#6cb524'
    description: Change in the documentation
  - name: dependencies
    color: '#70f9e0'
    description: Update dependencies

teams:
  - name: developers
    permission: admin

branches:
  - name: main
    protection:
      # A PR is required, without an approving review: there is no CODEOWNERS.
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
        dismissal_restrictions:
          users: []
          teams: []
      # The job names of .github/workflows/lint.yml, as the checks report them.
      required_status_checks:
        strict: true
        contexts:
          - go vet + test + lint
          - shellcheck bin/*
          - brew audit (if formulae changed)
          - lanes integration (macOS)
      enforce_admins: true
      required_linear_history: false
      required_conversation_resolution: true
      required_signatures: true
      restrictions:
        apps: []
        users: []
        teams: []
