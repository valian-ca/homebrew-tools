name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go vet + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  shellcheck:
    name: shellcheck bin/*
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if bin/ is empty
        id: check
        run: |
          if compgen -G "bin/*" > /dev/null; then
            echo "has_scripts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_scripts=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install shellcheck
        if: steps.check.outputs.has_scripts == 'true'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        if: steps.check.outputs.has_scripts == 'true'
        run: shellcheck -x bin/*

  brew-audit:
    name: brew audit (if formulae changed)
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed formulae
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # On the very first push to main, before is all-zero — skip audit.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "formulae=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Convert "Formula/<name>.rb" paths to "valian-ca/tools/<name>" qualified names,
          # since `brew audit` no longer accepts bare paths. --diff-filter=d skips
          # deleted formulae — they can't be audited once gone from the tap.
          formulae=$(git diff --name-only --diff-filter=d "$base"...HEAD -- 'Formula/*.rb' \
            | sed -E 's|^Formula/(.+)\.rb$|valian-ca/tools/\1|' \
            | tr '\n' ' ')
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"

      - name: Tap the checkout
        if: steps.changed.outputs.formulae != ''
        run: brew tap valian-ca/tools "$(pwd)"

      - name: Audit changed formulae
        if: steps.changed.outputs.formulae != ''
        run: brew audit --strict --online ${{ steps.changed.outputs.formulae }}

  lanes-macos:
    name: lanes integration (macOS)
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect lanes changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "lanes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base"...HEAD -- \
              'cmd/lanes/**' 'cmd/lanesd/**' 'internal/lanes/**' \
              'examples/lanes-demo/**' 'Formula/lanes.rb' '.github/workflows/lint.yml' \
              go.mod go.sum \
              | grep -q .; then
            echo "lanes=true" >> "$GITHUB_OUTPUT"
          else
            echo "lanes=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.changed.outputs.lanes == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Install process-compose
        if: steps.changed.outputs.lanes == 'true'
        run: brew install f1bonacc1/tap/process-compose

      - uses: actions/setup-java@v4
        if: steps.changed.outputs.lanes == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.lanes == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/lanes-demo/package-lock.json

      - name: Read the demo's firebase-tools version
        if: steps.changed.outputs.lanes == 'true'
        id: firebase
        run: echo "version=$(jq -r '.devDependencies["firebase-tools"]' examples/lanes-demo/package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.changed.outputs.lanes == 'true'
        id: emulators
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase.outputs.version }}

      # Parallel Firebase stacks would each download a missing jar into the
      # same path, and one of them starts on a partial file.
      - name: Download the Firebase emulators
        if: steps.changed.outputs.lanes == 'true' && steps.emulators.outputs.cache-hit != 'true'
        run: |
          for emulator in firestore pubsub ui; do
            npx --yes "firebase-tools@${{ steps.firebase.outputs.version }}" setup:emulators:$emulator
          done

      - name: go test -tags integration
        if: steps.changed.outputs.lanes == 'true'
        env:
          LANES_REQUIRE_FIREBASE: "1"
        run: go test -tags integration -timeout 30m ./internal/lanes/... ./cmd/lanes/... ./cmd/lanesd/...
